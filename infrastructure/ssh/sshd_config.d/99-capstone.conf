# Cấu hình SSH chuẩn cho Capstone Project

# 1. Cấm đăng nhập trực tiếp tài khoản root 
PermitRootLogin no

# 2. Bắt buộc xác thực bằng Public Key, cấm sử dụng password
PubkeyAuthentication yes
PasswordAuthentication no
# Vô hiệu hoá xác thực bằng keyboard-interactive (nếu có)
KbdInteractiveAuthentication no

# 3. Giới hạn người dùng có thể đăng nhập SSH
AllowUsers isqhung hetoke ngthdong mdungtc

# 4. Giới hạn số lần đăng nhập thất bại và thời gian khoá
MaxAuthTries 3
LoginGraceTime 30

# 5. Tắt tính năng X11 Forwarding và rhosts 
X11Forwarding no
IgnoreRhosts yes